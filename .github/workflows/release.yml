name: Release

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: Release tag to create, for example v4.5.7
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: adhan-release-${{ inputs.tag_version }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate tag does not already exist
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          git fetch --tags --force
          if git rev-parse "${TAG_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${TAG_VERSION} already exists"
            exit 1
          fi

      - name: Update package version
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          export VERSION="${TAG_VERSION#v}"
          node <<'EOF'
          const fs = require("fs");
          const path = "package.json";
          const json = JSON.parse(fs.readFileSync(path, "utf8"));
          json.version = process.env.VERSION;
          fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          EOF
        shell: bash

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Authenticate npm to Artifact Registry
        env:
          NPM_REGISTRY_PATH: ${{ vars.GCP_REGION }}-npm.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.NPM_ARTIFACT_REGISTRY_REPOSITORY }}/
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          {
            echo "@wifaqululama:registry=https://${NPM_REGISTRY_PATH}"
            echo "//${NPM_REGISTRY_PATH}:_authToken=${ACCESS_TOKEN}"
            echo "//${NPM_REGISTRY_PATH}:always-auth=true"
          } > "${HOME}/.npmrc"

      - name: Check package version
        id: package_version
        env:
          PACKAGE_NAME: '@wifaqululama/adhan'
          PACKAGE_VERSION: ${{ inputs.tag_version }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          if gcloud artifacts versions list \
            --package="${PACKAGE_NAME}" \
            --repository="${{ vars.NPM_ARTIFACT_REGISTRY_REPOSITORY }}" \
            --location="${{ vars.GCP_REGION }}" \
            --filter="name~/${VERSION}$" \
            --format="value(name)" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.package_version.outputs.exists == 'false'
        run: npm publish . --registry "https://${{ vars.GCP_REGION }}-npm.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.NPM_ARTIFACT_REGISTRY_REPOSITORY }}/"

      - name: Commit version change
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          git add package.json
          git diff --cached --quiet && {
            echo "No version changes detected"
            exit 1
          }
          git commit -m "chore(release): ${TAG_VERSION}"

      - name: Create and push tag
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          git tag "${TAG_VERSION}"
          git push origin HEAD
          git push origin "refs/tags/${TAG_VERSION}"
